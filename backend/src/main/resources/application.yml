spring:
  application:
    name: book-tracker
  datasource:
    url: jdbc:h2:file:./data/booktracker;AUTO_SERVER=TRUE
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

app:
  google-books:
    base-url: https://www.googleapis.com/books/v1
    api-key: ${GOOGLE_BOOKS_API_KEY:}